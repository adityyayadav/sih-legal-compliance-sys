  <rect width="1600" height="620" fill="url(#scrim2)"/>
  <rect x="0" y="600" width="1600" height="6" fill="#ff9933"/>
  <rect x="0" y="606" width="1600" height="6" fill="#ffffff"/>
  <rect x="0" y="612" width="1600" height="8" fill="#138808"/>
