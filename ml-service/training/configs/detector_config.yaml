# Detector Fine-Tuning Configuration (Phase 4)
model:
  name: "layoutlmv3-base"
  pretrained: true
  num_labels: 11

training:
  epochs: 10
  batch_size: 4
  learning_rate: 5e-5
  warmup_ratio: 0.1
  weight_decay: 0.01
  eval_steps: 50
  save_total_limit: 2

data:
  train_dir: "data/processed/train"
  val_dir: "data/processed/val"
  image_size: [1024, 1024]
  normalize_boxes: true
