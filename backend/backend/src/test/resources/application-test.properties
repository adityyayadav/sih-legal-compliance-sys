# Test profile — H2 in-memory, no external services. Activated by
# @ActiveProfiles("test") on the test classes. Profile-specific properties
# override the base application.properties and its imported .env.

spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# local image store writes here during tests (mock storage/ML are active under 'test')
app.uploads.dir=${java.io.tmpdir}/packsure-test-uploads

jwt.secret=dGVzdHNlY3JldHRlc3RzZWNyZXR0ZXN0c2VjcmV0dGVzdHNlY3JldHRlc3RzZWNyZXQ=
jwt.expiration-ms=86400000
jwt.refresh-expiration-days=7
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test
ml.service.base-url=http://localhost:7860/api/v1
