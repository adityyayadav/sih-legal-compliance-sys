server.port=8080

spring.config.import=optional:file:backend/backend/.env[.properties]

# SUPABASE DATABASE CONFIGURATION
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT AUTHENTICATION CONFIGURATION
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS}

# CLOUDINARY CONFIGURATION
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ML SERVICE CONFIGURATION
ml.service.base-url=${ML_SERVICE_URL}

# UPLOAD RESTRICTIONS (To handle 4k camera photos from Inspectors)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB