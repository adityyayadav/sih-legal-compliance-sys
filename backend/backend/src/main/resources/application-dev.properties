# 'dev' profile — in-memory H2 + fully mocked external services.
# No Supabase / Cloudinary / ML service needed. Data is wiped on every restart.
#
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
#
# Image uploads are stored on local disk (./uploads, served at /uploads/**) and
# the ML analysis is a deterministic mock, so the whole scan flow works offline.

# ── H2 (PostgreSQL compatibility mode) ────────────────────────────
spring.datasource.url=jdbc:h2:mem:devdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── App ──────────────────────────────────────────────────────────
jwt.secret=uNfAuvZ3Vf1VCVqTgWL0BPSXJWmiuTLztR5iVqsucMBS6tZHK9xg4/NDeWkpux2X
jwt.expiration-ms=86400000
jwt.refresh-expiration-days=7
app.uploads.dir=uploads

# Cloudinary + ML config are NOT read in this profile (their beans are
# @Profile("!dev & !test")). Left here as documentation only.
