# 'dev' profile — boots with an in-memory H2 database and dummy external creds.
# No Supabase / Cloudinary account needed. Data is wiped on every restart.
#
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
#
# Cloudinary uploads and real ML calls will fail at call time (dummy creds) —
# that's expected; use this profile for auth/product/endpoint work.

# ── H2 (PostgreSQL compatibility mode) ────────────────────────────
spring.datasource.url=jdbc:h2:mem:devdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Dummy values so beans construct without real services ─────────
jwt.secret=uNfAuvZ3Vf1VCVqTgWL0BPSXJWmiuTLztR5iVqsucMBS6tZHK9xg4/NDeWkpux2X
jwt.expiration-ms=86400000
jwt.refresh-expiration-days=7
cloudinary.cloud-name=dev
cloudinary.api-key=dev
cloudinary.api-secret=dev
ml.service.base-url=http://localhost:7860/api/v1
