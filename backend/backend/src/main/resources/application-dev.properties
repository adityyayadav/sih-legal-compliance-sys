# 'dev' profile — in-memory H2 + local image store. Data is wiped on every restart.
#
#   mvn spring-boot:run "-Dspring-boot.run.profiles=dev"
#
# By default the ML analysis is a deterministic in-process mock (app.ml.mock=true),
# so the whole scan flow works offline with no Supabase / Cloudinary / ML service.
#
# To use the REAL ML service while still on H2 + local storage, start it on
# :7860 and run with:
#   mvn spring-boot:run "-Dspring-boot.run.profiles=dev" "-Dspring-boot.run.arguments=--app.ml.mock=false"

# ── H2 (PostgreSQL compatibility mode) ────────────────────────────
spring.datasource.url=jdbc:h2:mem:devdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── App ──────────────────────────────────────────────────────────
jwt.secret=uNfAuvZ3Vf1VCVqTgWL0BPSXJWmiuTLztR5iVqsucMBS6tZHK9xg4/NDeWkpux2X
jwt.expiration-ms=86400000
jwt.refresh-expiration-days=7
app.uploads.dir=uploads
app.ml.mock=true
ml.service.base-url=http://localhost:7860/api/v1

# Cloudinary is not used in this profile — images go to local disk instead.
